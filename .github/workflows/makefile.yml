name: Build UID Filter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android NDK
        shell: pwsh
        run: |
          sdkmanager --install "ndk;27.3.13750724"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk) { $sdk = $env:ANDROID_HOME }
          if (-not $sdk) { throw "ANDROID_SDK_ROOT / ANDROID_HOME not found" }
          $ndk = Join-Path $sdk 'ndk/27.3.13750724'
          if (-not (Test-Path (Join-Path $ndk 'toolchains/llvm/prebuilt/windows-x86_64/bin/clang++.exe'))) {
            throw "Expected NDK compiler not found at $ndk"
          }
          "ANDROID_NDK_HOME=$ndk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile and package Zygisk module
        shell: pwsh
        run: python tools/uid-seccomp-module/build.py --module-only

      - name: Upload installable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: UID-Filter-v0.2.6
          path: |
            build/0.2.6/cq-uid-seccomp-0.2.6.zip
            build/0.2.6/cq-uid-seccomp-0.2.6.zip.sha256
          if-no-files-found: error
